<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSMS Tanzania AI - Smart Education Assistant</title>
    <!-- Tailwind CSS for modern, adaptive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js to handle Markdown conversion -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .bubble-user {
            background-color: #FFFFFF;
            border: 1px solid #D1D5DB;
            color: #000000;
            border-radius: 20px 20px 5px 20px;
        }
        .bubble-ai {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #FFFFFF;
            border-radius: 5px 20px 20px 20px;
        }
        .bubble-ai code {
            background: rgba(255,255,255,0.15);
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .bubble-ai pre {
            background: rgba(0,0,0,0.3);
            padding: 0.5rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .bubble-ai table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.5rem 0;
        }
        .bubble-ai th, .bubble-ai td {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.3rem 0.5rem;
            text-align: left;
        }
        .bubble-ai th {
            background: rgba(255,255,255,0.1);
        }
        .bubble-ai ul, .bubble-ai ol {
            padding-left: 1.5rem;
            margin: 0.3rem 0;
        }
        .chat-scroll {
            scrollbar-width: thin;
            scroll-behavior: smooth;
        }
        /* Typing animation dot */
        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
            margin: 0 2px;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.8rem;
        }
        /* SSMS Tanzania Brand Colors */
        .ssms-primary { background: #1e3c72; }
        .ssms-secondary { background: #2a5298; }
        .ssms-accent { color: #f39c12; }
        .ssms-gradient { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .ssms-gradient-text { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between font-sans">

    <!-- Top Bar - SSMS Tanzania Branding -->
    <header class="ssms-gradient text-white py-4 px-6 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>🏫</span> {{ app_name }}
        </h1>
        <div class="flex items-center gap-3">
            <button id="btnClear" class="text-xs bg-red-600 hover:bg-red-700 text-white font-semibold py-1.5 px-3 rounded-lg transition-all" title="Futa historia yote">
                🗑️ Futa Chat
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 w-full max-w-4xl mx-auto p-4 flex flex-col overflow-hidden h-[calc(100vh-140px)]">
        
        <!-- Chat Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto chat-scroll space-y-4 p-4 bg-white rounded-xl border border-gray-200 shadow-inner">
            <!-- Dynamic Messages will load here -->
        </div>

        <!-- Working Status Indicator -->
        <div id="statusMsg" class="hidden text-sm text-slate-500 italic py-1 px-4 animate-pulse flex items-center gap-2">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-600"></span>
            <span id="statusText">● SSMS AI inajiandaa...</span>
        </div>

        <!-- Attachment and Image preview -->
        <div id="imagePreviewCard" class="hidden relative p-2 bg-gray-100 rounded-lg border border-dashed border-gray-300 mt-2 max-w-[200px]">
            <img id="imgPreview" class="rounded object-cover max-h-32 w-full" src="" alt="Preview">
            <button id="btnRemoveImage" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full p-1 text-xs hover:bg-red-700 shadow-lg" title="Ondoa Picha">
                ✕
            </button>
            <div id="fileNameDisplay" class="text-xs text-gray-500 mt-1 truncate">📎 Picha imepakiwa</div>
        </div>

        <!-- Input Bar Form -->
        <form id="processForm" class="mt-3 flex items-center gap-2 bg-white p-2 rounded-xl border border-gray-200 shadow-md">
            <!-- Attachment Button -->
            <button type="button" id="btnAttach" class="p-3 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600 transition-colors" title="Pakia picha">
                📷
            </button>
            <input type="file" id="fileInput" name="image" accept="image/*" class="hidden">
            <input type="file" id="cameraInput" name="cameraImage" accept="image/*" capture="environment" class="hidden">

            <input type="text" id="promptInput" name="prompt" placeholder="Andika swali lako hapa au pakia picha..." class="flex-1 border-0 focus:ring-0 focus:outline-none text-base px-2">
            
            <button type="submit" id="btnProcess" class="ssms-gradient text-white font-bold py-3 px-6 rounded-lg transition-all hover:shadow-lg">
                Tuma
            </button>
        </form>
    </main>

    <!-- Name Prompt Modal (Karibu Dialog) -->
    <div id="nameModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full">
            <div class="text-center mb-4">
                <span class="text-4xl">🏫</span>
                <h2 class="text-2xl font-bold ssms-gradient-text mt-2">SSMS Tanzania AI</h2>
                <p class="text-sm text-gray-500">Smart Education Assistant</p>
            </div>
            <p class="text-sm text-gray-600 mb-4 text-center">
                Karibu! Ingiza jina lako ili tuanze msaada wa elimu.
            </p>
            <input type="text" id="nameInput" placeholder="Jina lako hapa..." class="w-full border border-gray-300 rounded-lg p-2.5 mb-4 focus:ring-2 focus:ring-indigo-500 focus:outline-none capitalize">
            <button id="btnSaveName" class="w-full ssms-gradient text-white font-bold py-2.5 rounded-lg hover:shadow-lg transition-all">
                🚀 Anza
            </button>
        </div>
    </div>

    <!-- Page Logic Integration -->
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const promptInput = document.getElementById('promptInput');
        const statusMsg = document.getElementById('statusMsg');
        const statusText = document.getElementById('statusText');
        const imagePreviewCard = document.getElementById('imagePreviewCard');
        const imgPreview = document.getElementById('imgPreview');
        const btnRemoveImage = document.getElementById('btnRemoveImage');
        const btnAttach = document.getElementById('btnAttach');
        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput');
        const btnProcess = document.getElementById('btnProcess');
        const processForm = document.getElementById('processForm');
        const nameModal = document.getElementById('nameModal');
        const nameInput = document.getElementById('nameInput');
        const btnSaveName = document.getElementById('btnSaveName');
        const btnClear = document.getElementById('btnClear');

        let isGenerating = false;
        let selectedFile = null;

        // On Load checks for User session name
        window.onload = () => {
            const userName = localStorage.getItem('user_name_2026');
            if (!userName) {
                nameModal.classList.remove('hidden');
            } else {
                nameModal.classList.add('hidden');
                sendNameToServer(userName);
                // Add welcome message from server via API
                fetchWelcomeMessage(userName);
            }
        };

        function fetchWelcomeMessage(name) {
            fetch('/set_name', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    addMessageBubble("SSMS AI", data.welcome_message, false);
                }
            });
        }

        btnSaveName.addEventListener('click', () => {
            let name = nameInput.value.trim();
            if(!name) name = "Mwalimu";
            localStorage.setItem('user_name_2026', name);
            nameModal.classList.add('hidden');
            sendNameToServer(name);
        });

        function sendNameToServer(name) {
            fetch('/set_name', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    addMessageBubble("SSMS AI", data.welcome_message, false);
                }
            });
        }

        // Image Selection
        btnAttach.addEventListener('click', () => {
            const selectSource = confirm("Chagua chanzo cha picha:\n\nOK - Piga Picha (Camera)\nCancel - Chagua kutoka Gallery");
            if (selectSource) {
                cameraInput.click();
            } else {
                fileInput.click();
            }
        });

        function handleFile(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                    imagePreviewCard.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        fileInput.addEventListener('change', () => handleFile(fileInput));
        cameraInput.addEventListener('change', () => handleFile(cameraInput));

        btnRemoveImage.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = "";
            cameraInput.value = "";
            imagePreviewCard.classList.add('hidden');
        });

        // Clear History Handler
        btnClear.addEventListener('click', () => {
            if (confirm("Je, una uhakika unataka kufuta historia ya mazungumzo?")) {
                fetch('/clear', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    chatContainer.innerHTML = "";
                    // Reset with welcome message after clearing
                    const userName = localStorage.getItem('user_name_2026') || 'Mwalimu';
                    sendNameToServer(userName);
                });
            }
        });

        // Form Submit
        processForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isGenerating) return;

            const promptText = promptInput.value.trim();
            if (!promptText && !selectedFile) return;

            // Render user bubble
            if (promptText) {
                addMessageBubble("User", promptText, false);
            }

            // Prepare Payload
            const formData = new FormData();
            formData.append('prompt', promptText);
            if (selectedFile) {
                formData.append('image', selectedFile);
            }

            // Reset UI
            promptInput.value = "";
            selectedFile = null;
            fileInput.value = "";
            cameraInput.value = "";
            imagePreviewCard.classList.add('hidden');

            isGenerating = true;
            statusMsg.classList.remove('hidden');
            statusText.innerText = "● SSMS AI inatafuta jibu...";
            btnProcess.innerText = "Inasubiri...";

            // Add typing indicator
            const typingId = addTypingIndicator();

            fetch('/process', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                isGenerating = false;
                statusMsg.classList.add('hidden');
                btnProcess.innerText = "Tuma";
                removeTypingIndicator(typingId);

                if (data.error) {
                    alert("❌ " + data.error);
                } else {
                    addMessageBubble("SSMS AI", data.response, true);
                }
            })
            .catch(err => {
                isGenerating = false;
                statusMsg.classList.add('hidden');
                btnProcess.innerText = "Tuma";
                removeTypingIndicator(typingId);
                alert("❌ Hitilafu ya mtandao imetokea. Tafadhali jaribu tena.");
            });
        });

        // Add typing indicator
        function addTypingIndicator() {
            const id = 'typing-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex w-full justify-start';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble-ai p-4 max-w-xl';
            bubble.innerHTML = `
                <div class="typing-indicator">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span style="font-size:0.8rem; margin-left: 0.5rem;">SSMS AI inaandika...</span>
                </div>
            `;
            
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        // Build and render chat bubbles
        function addMessageBubble(sender, text, animate) {
            const isUser = (sender === 'User');
            
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-xl p-4 shadow-sm text-sm ${isUser ? 'bubble-user' : 'bubble-ai'}`;

            messageWrapper.appendChild(bubble);
            chatContainer.appendChild(messageWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (animate && !isUser) {
                let index = 0;
                const chunk = 15;
                
                function type() {
                    if (index < text.length) {
                        index = Math.min(index + chunk, text.length);
                        bubble.innerHTML = marked.parse(text.substring(0, index));
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        setTimeout(type, 1);
                    } else {
                        statusText.innerText = "✓ Jibu limewasilishwa";
                        setTimeout(() => statusMsg.classList.add('hidden'), 1000);
                    }
                }
                type();
            } else {
                bubble.innerHTML = marked.parse(text);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // Keyboard shortcut: Enter to submit
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                processForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
